<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Hisably View</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png"><link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Hisably View"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#F8F0EC;--sf:#fff;--s2:#F4EAE6;--tx:#2A1214;--mu:#8F7A78;--bd:rgba(42,18,20,.09);--pr:#B3121F;--pr2:#D32030;--prt:#fff;--gold:#FFD59A;--ivory:#FDF4EA;--ok:#176B55;--bad:#9B1020;--gl:rgba(179,18,31,.25);--sh:0 1px 1px rgba(42,18,20,.03),0 14px 36px rgba(42,18,20,.06)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}html{-webkit-text-size-adjust:100%}[hidden]{display:none!important}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;padding-bottom:calc(118px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
header{position:sticky;top:0;z-index:4;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 20px 8px;background:var(--bg);}
header b{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;letter-spacing:-.02em}
header b::before{content:"";width:34px;height:34px;border-radius:10px;background:url(../icons/icon-96.png) center/cover no-repeat;box-shadow:0 1px 4px rgba(42,18,20,.15)}
#net{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--mu);padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.7)}
#net::before{content:"";width:6px;height:6px;border-radius:50%;background:#2FB27F}
#net.off::before{background:#9B1020}
main{max-width:760px;margin:auto;padding:8px 20px 20px}
h2{font-size:clamp(32px,8.5vw,40px);font-weight:800;letter-spacing:-.05em;line-height:1.04;margin:10px 0 20px}h2 span{color:#D2B8B3}
h3{font-size:19px;font-weight:700;letter-spacing:-.03em}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.acts{display:flex;gap:8px;padding-top:12px}
.rb{width:46px;height:46px;min-height:0;padding:0;border-radius:50%;font-size:26px;font-weight:400;background:#fff;border:0;box-shadow:var(--sh)}.rb.dk{background:var(--tx);color:#fff}
.card{background:var(--sf);border-radius:28px;box-shadow:var(--sh);padding:18px 20px;margin:14px 0}
.k{font-size:12px;font-weight:600;color:var(--mu)}.v{font-size:clamp(21px,5vw,26px);font-weight:800;letter-spacing:-.04em;margin-top:4px;overflow-wrap:anywhere}
.mut{color:var(--mu);font-size:12.5px}p.mut{text-align:center;padding:26px 10px}
.hero{position:relative;overflow:hidden;border-radius:34px;padding:24px 22px 16px;color:#fff;background:radial-gradient(120% 90% at 100% 0,#F0524F 0,transparent 55%),linear-gradient(160deg,#C4162A,#7A0A14);box-shadow:0 24px 46px rgba(179,18,31,.3)}
.hero .k{color:#F6C9C4}.hero .big{font-size:clamp(40px,12vw,54px);font-weight:800;letter-spacing:-.055em;line-height:1.05;margin:6px 0 4px;color:var(--gold)}.big small{font-size:.36em;letter-spacing:0;margin-right:7px;font-weight:700;color:#E0A85C}
.hero svg{width:100%;height:92px;display:block;margin-top:12px}.dl{display:flex;justify-content:space-between;padding:4px 2px 0;font-size:10.5px;font-weight:600;color:#F2B3AD}.dl span{width:14%;text-align:center}
.lg{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11.5px;color:#F6C9C4}.lg i{width:8px;height:8px;border-radius:50%}.lg i+i,.lg i:not(:first-child){margin-left:8px}.lg em{margin-left:auto;font-style:normal;opacity:.7}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12)}.tri span{display:block;font-size:11px;color:#F6C9C4}.tri b{font-size:13.5px;font-weight:700;color:#fff;white-space:normal}.tri .g{color:#6FD1B0}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.duo .card{position:relative;margin:0;padding:16px 18px;border-radius:26px}.duo .v{font-size:21px}.ar{position:absolute;top:14px;right:16px;font-size:18px;font-weight:700}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:28px 4px 12px}.sh a{font-size:13px;font-weight:600;color:var(--mu);text-decoration:none}
.stack{margin-bottom:4px}.sc{position:relative;display:block;border-radius:28px;padding:15px 20px 46px;text-decoration:none;box-shadow:0 -8px 22px rgba(42,18,20,.07);transition:transform .2s}.sc+.sc{margin-top:-46px}.sc:active{transform:scale(.985)}
.sc .t{display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:700;letter-spacing:-.02em}.sc .t span{font-size:12.5px;font-weight:600;opacity:.65}
.c0{background:#fff;color:var(--tx)}.c3{background:#F9E4E1;color:var(--tx)}.c4{background:#F4EDDC;color:#3B2E10}.c5{background:#8E1B26;color:#fff}.duo .card{cursor:pointer}.duo .card:active{transform:scale(.98)}.c1{background:#FBE0B8;color:#3B2E10}.c2{background:var(--pr);color:#fff}.sc.front{padding-bottom:22px}
.sc .amt{font-size:clamp(34px,10vw,44px);font-weight:800;letter-spacing:-.055em;color:var(--gold);margin-top:26px}.sc .num{margin-top:6px;font-size:13px;letter-spacing:.12em;opacity:.6}
button{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:inherit;font-weight:600;font-size:15px;padding:13px 20px;min-height:48px;border-radius:99px;cursor:pointer;color:var(--tx);background:#fff;border:0;box-shadow:0 1px 2px rgba(42,18,20,.06);transition:transform .15s,filter .15s}
button:active{transform:scale(.96)}button.p{color:#fff;background:var(--tx);box-shadow:0 10px 24px rgba(42,18,20,.25)}button.g{background:var(--ok);color:#fff;box-shadow:0 10px 24px rgba(23,107,85,.28)}
button.d{color:var(--bad)}button:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.btns>*{flex:1 1 140px}
label{display:block;font-size:13px;font-weight:600;color:var(--mu);margin:16px 0 7px 4px}
input,select,textarea{width:100%;min-height:50px;padding:13px 16px;border-radius:15px;border:0;background:var(--s2);color:var(--tx);font:inherit;font-size:16px}
main>input,.toolbar>input{background:#fff;box-shadow:var(--sh)}dialog input,dialog select,dialog textarea{background:#fff}
textarea.urdu{font-family:'Noto Naskh Arabic',serif;font-size:18px;line-height:1.8;direction:rtl;text-align:right}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--pr) 35%,transparent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--bd);min-width:0}.row:last-child{border:0}
.row>:first-child{min-width:0;overflow-wrap:anywhere}.row b{white-space:nowrap;font-weight:700}.row:active{background:var(--s2)}
.who{display:flex;align-items:center;gap:12px;min-width:0}.who b{display:block;white-space:normal}
.av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:17px;font-style:normal;color:var(--gold);background:linear-gradient(145deg,#B3121F,#E0434B)}
.ti{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:700;font-style:normal}.ti.o{background:rgba(179,18,31,.08);color:var(--pr)}.ti.i{background:rgba(23,107,85,.12);color:var(--ok)}
b.out{color:var(--tx)}b.in,.in{color:var(--ok)}.pend b.out,a.out{color:var(--bad)}
.row a{display:inline-block;margin:6px 0 0 4px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;color:var(--pr);background:rgba(179,18,31,.07);text-decoration:none}.row a.out{background:rgba(155,16,32,.09)}
.seg{display:flex;gap:3px;padding:3px;background:#EBDDD8;border-radius:99px;margin:8px 0 4px}.seg button{flex:1;min-height:42px;border:0;background:none;box-shadow:none;color:var(--mu)}
.seg button.on{background:#fff;color:var(--tx);box-shadow:0 2px 8px rgba(42,18,20,.12)}.seg button.on.pay{color:var(--ok)}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0 8px}.quick button{width:100%;min-height:46px;justify-content:flex-start;text-align:left;padding:10px 12px;border:1px solid var(--bd);border-radius:15px;font-size:13px;line-height:1.2;color:var(--pr);background:#fff;box-shadow:0 2px 8px rgba(42,18,20,.04)}.quick button::before{content:"";width:18px;height:18px;flex:none;display:grid;place-items:center;border-radius:50%;background:#F8E2DF;color:var(--pr);font-size:12px;font-weight:800}.quick button.sel{color:#fff;background:var(--pr);border-color:var(--pr);box-shadow:0 5px 14px rgba(179,18,31,.2)}.quick button.sel::before{content:"✓";background:var(--gold);color:var(--pr)}.quick button.add{grid-column:1/-1;justify-content:center;color:var(--ok);background:#FBF3EC;border:1px dashed rgba(23,107,85,.32);box-shadow:none}.quick button.add::before{content:none}.quick-note{margin-top:2px;font-size:12px}
.customer-picker{position:relative}.customer-options{max-height:230px;overflow-y:auto;overscroll-behavior:contain;margin-top:7px;padding:5px;background:#fff;border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);-webkit-overflow-scrolling:touch}.customer-options[hidden]{display:none}.customer-option{width:100%;min-height:46px;display:flex;justify-content:space-between;text-align:left;padding:10px 12px;border-radius:11px;background:transparent;box-shadow:none;font-size:14px}.customer-option+.customer-option{border-top:1px solid var(--bd)}.customer-option small{color:var(--mu);font-size:12px}.customer-empty{padding:12px;color:var(--mu);font-size:13px}
#lc{background:var(--ivory);box-shadow:none;border-radius:22px;padding:6px 18px;margin:16px 0}#lc .row{padding:11px 0;border-bottom:1px dashed rgba(179,18,31,.18)}
#lc .row:last-child{border:0;border-top:2px solid var(--tx);margin-top:4px;padding-top:14px}#lc .row:last-child b{font-size:25px;font-weight:800;letter-spacing:-.04em}
.pend{background:#FBF1DC;border-radius:22px;box-shadow:none}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(calc(100% - 28px),440px);z-index:5;display:flex;align-items:center;padding:7px;border-radius:36px;background:#fff;border:1px solid rgba(255,255,255,.75);box-shadow:0 18px 44px rgba(42,18,20,.18)}nav:empty{display:none}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:#9C8A88;padding:8px 0 7px;border-radius:28px;text-decoration:none;transition:background .2s,color .2s}nav a svg{width:22px;height:22px}nav a.on{color:var(--pr);background:rgba(179,18,31,.08)}
nav a:nth-child(3){flex:none;width:58px;height:58px;margin:-24px 6px 0;padding:0;justify-content:center;border-radius:50%;background:var(--tx);color:var(--gold);box-shadow:0 12px 26px rgba(42,18,20,.35),0 0 0 5px rgba(248,240,236,.95)}nav a:nth-child(3) span{display:none}nav a:nth-child(3) svg{width:26px;height:26px}
dialog{border:0;padding:12px 22px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:520px;max-height:92vh;margin:auto auto 0;border-radius:32px 32px 0 0;background:var(--bg);color:var(--tx);overflow:auto}
dialog::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:rgba(42,18,20,.18);margin:0 auto 16px}
dialog[open]{animation:up .28s cubic-bezier(.2,.8,.2,1)}dialog::backdrop{background:rgba(30,8,10,.42);}@keyframes up{from{transform:translateY(40px);opacity:0}}
dialog h3{font-size:21px}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:40;display:none;max-width:90vw;padding:12px 20px;border-radius:99px;background:rgba(42,18,20,.92);color:#fff;font-weight:600;font-size:14px;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.28)}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 7px}.lrow label{margin:0 0 0 4px}.lrow button{min-height:34px;padding:6px 14px;font-size:13px;color:var(--pr);background:#F8E2DF;box-shadow:none}
.dtrow{display:flex;gap:10px;align-items:center}.dtrow>input{flex:1}.calw{position:relative;flex:none;width:50px;height:50px;border-radius:15px;background:var(--pr);color:#fff;display:grid;place-items:center;overflow:hidden}.calw svg{pointer-events:none}.calw input{position:absolute;inset:0;width:100%;height:100%;min-height:0;padding:0;opacity:0;cursor:pointer}
#dupwarn{display:none;position:fixed;inset:auto;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);margin:0;z-index:60;max-width:92vw;width:max-content;padding:13px 18px;border:1px solid rgba(155,16,32,.35);border-radius:18px;background:rgba(255,240,214,.88);color:#7A0F1A;font-family:inherit;font-weight:600;font-size:14px;line-height:1.4;text-align:left;box-shadow:0 14px 34px rgba(0,0,0,.2);pointer-events:none;overflow:visible}#dupwarn.show{display:block}
.dupb{background:#FFF0D6;color:#7A0F1A;border-radius:14px;padding:10px 14px;margin:0 0 10px;font-size:13px;font-weight:600}
.stm{--tx:#182533;--mu:#7C6865;--bd:#EADAD6;--s2:#f3f4f6;background:#fff;color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:30px 28px;overflow-x:auto;margin-top:16px;box-shadow:var(--sh)}
.stm h2{font-size:26px;font-weight:800;letter-spacing:-.04em;color:var(--tx)}.stm h3{font-size:16px;margin:16px 0 2px;color:var(--tx)}
.stm table{width:100%;border-collapse:collapse;font-size:13px;margin-top:14px;min-width:520px}
.stm th{padding:10px 8px;text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--mu);background:var(--s2);white-space:nowrap}.stm td{padding:10px 8px;border-top:1px solid var(--bd);vertical-align:top}.n{text-align:right!important;white-space:nowrap}
.tot{margin-top:18px;padding-top:12px;text-align:right;font-size:13px;color:var(--mu)}.close{display:flex;justify-content:flex-end;align-items:baseline;gap:16px;margin-top:6px;color:var(--tx);font-weight:600;font-size:14px}.close b{font-size:30px;font-weight:800;letter-spacing:-.04em;color:var(--tx)}
.stm.t1{background:#FDF4EA;border-color:#ecd9c4}.stm.t1 h2,.stm.t1 .close b{color:#B3121F}.stm.t1 th{background:none;color:#B3121F;border-top:2px solid #FFD59A;border-bottom:1px solid #B3121F}.stm.t1 td{border-color:#ecd9c4}.stm.t1 .tot{border-top:2px solid #FFD59A}
.stm.t2{--tx:#000;border-radius:6px;padding:22px}.stm.t2 th{background:none;color:#000;border-bottom:2px solid #000}.stm.t2 td{padding:5px 8px;border-color:#d4d4d4}.stm.t2 .tot{border-top:2px solid #000;color:#000}.stm.t2 .close b{font-size:20px}
.stm.t3{border-left:4px solid #176B55}.stm.t3 h2,.stm.t3 h3,.stm.t3 .close b{color:#176B55}.stm.t3 th{background:none;color:#176B55;border-bottom:2px solid #176B55}.stm.t3 .tot{background:#176B550f;margin:18px -28px -30px;padding:16px 28px}
@media(min-width:900px){body{padding:0 0 30px 280px}header{display:none}main{padding:34px 40px;max-width:820px}
 nav{left:16px;top:16px;bottom:16px;transform:none;width:248px;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:2px;padding:88px 12px 16px;border-radius:30px}
 nav::before{content:"";position:absolute;top:24px;left:26px;width:40px;height:40px;border-radius:12px;background:url(../icons/icon-96.png) center/cover no-repeat;box-shadow:0 1px 4px rgba(42,18,20,.15)}
 nav::after{content:"Hisably";position:absolute;top:31px;left:78px;font-weight:800;font-size:20px;letter-spacing:-.04em}
 nav a{flex:none;flex-direction:row;gap:12px;padding:12px 14px;font-size:14px;border-radius:16px}
 nav a:nth-child(3){width:auto;height:auto;margin:0;padding:12px 14px;border-radius:16px;background:none;color:#9C8A88;box-shadow:none}nav a:nth-child(3) span{display:inline}nav a:nth-child(3) svg{width:22px;height:22px}nav a:nth-child(3).on{background:rgba(179,18,31,.08);color:var(--pr)}
 .btns>*{flex:0 1 auto}dialog{margin:auto;border-radius:32px}}
/* ================= DESKTOP / LARGE SCREENS =================
   Mobile design is untouched. Everything below only applies on wide screens. */
@media(min-width:900px){
 html{scrollbar-width:thin;scrollbar-color:rgba(42,18,20,.25) transparent}
 body{padding:0 0 48px 280px}
 /* connection status pill moves to the top-right corner (the mobile header is hidden) */
 header{display:flex;position:fixed;top:18px;right:30px;left:auto;padding:0;background:none;z-index:6}
 header b{display:none}
 #net{font-size:12px;padding:8px 15px;background:#fff;box-shadow:var(--sh)}
 main{max-width:900px;padding:68px 48px 40px}
 h2{font-size:44px;margin:6px 0 28px}
 h3{font-size:20px}
 .card{padding:22px 26px;margin:16px 0}
 .hero{border-radius:40px;padding:34px 38px 24px}
 .hero .k{font-size:13px}.hero .big{font-size:64px}.hero svg{height:150px}.dl{font-size:11.5px}.tri b{font-size:16px}.tri span{font-size:12px}
 .duo{gap:16px;margin:16px 0}.duo .card{padding:22px 26px;border-radius:30px}.duo .v{font-size:28px}.ar{top:20px;right:24px;font-size:22px}
 .sc{padding:18px 26px 52px;border-radius:30px}.sc+.sc{margin-top:-50px}.sc .t{font-size:18px}.sc .amt{font-size:50px;margin-top:32px}.sc.front{padding-bottom:26px}
 .row{padding:15px 4px}.row b{font-size:15.5px}.av{width:48px;height:48px;font-size:18px}.ti{width:42px;height:42px}
 input,select,textarea{min-height:52px}
 label{font-size:13.5px}
 /* sidebar */
 nav a{transition:background .15s,color .15s,transform .15s}
 nav a:nth-child(3),nav a:nth-child(3).on{margin:10px 0 8px;background:var(--tx);color:#fff;box-shadow:0 12px 24px rgba(42,18,20,.22)}
 nav a:nth-child(3) svg{color:var(--gold)}
 nav a.on:not(:nth-child(3)){font-weight:700}
 /* dialogs become centred modals */
 dialog{max-width:560px;padding:30px 34px 34px;border-radius:34px;box-shadow:0 40px 90px rgba(30,8,10,.35)}
 dialog::before{display:none}
 dialog[open]{animation:pop .2s cubic-bezier(.2,.8,.2,1)}
 @keyframes pop{from{transform:scale(.96);opacity:0}}
 #toast{top:22px}
 /* statement preview looks like an A4 sheet, and exports at the same width as on phones */

 /* customer tiles */
 .card.cl{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px;background:none;box-shadow:none;padding:0}
 .cl .row{background:#fff;border:0;border-radius:26px;padding:18px 22px;box-shadow:var(--sh);transition:transform .18s,box-shadow .18s}
 .cl p.mut{grid-column:1/-1}
 .cl .row>:first-child{overflow-wrap:normal}.cl .who .mut{white-space:nowrap}.cl .who>div{min-width:0}.cl .who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .toolbar{display:flex;gap:14px;align-items:center}.toolbar>input{flex:1}.toolbar .btns{margin:0;flex:none;flex-wrap:nowrap}.toolbar .btns>*{flex:none;white-space:nowrap}
 .quick button{min-height:46px}
}
@media(min-width:900px) and (hover:hover){
 button:not(:disabled):hover{filter:brightness(.95)}button.p:not(:disabled):hover,button.g:not(:disabled):hover{filter:brightness(1.18)}
 .rb:hover{transform:scale(1.07)}
 nav a:not(.on):hover{background:rgba(179,18,31,.06);color:var(--pr)}nav a:nth-child(3):hover{background:var(--tx);color:#fff;transform:translateY(-1px)}
 .sc:hover{transform:translateY(-4px)}
 .row:hover{background:var(--s2);box-shadow:-10px 0 0 var(--s2),10px 0 0 var(--s2);border-radius:6px}
 .cl .row:hover{background:#fff;border-radius:26px;transform:translateY(-3px);box-shadow:0 20px 44px rgba(42,18,20,.13)}
 .customer-option:hover{background:var(--s2)}
}
/* ---- laptops and up: real multi-column pages ---- */
